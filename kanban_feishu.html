<script>
const APP_ID='cli_aa84683904b99beb';
const APP_SECRET='PiOVn71pA8aRDtgADI1fCfvhnm8n1yz5';
const WIKI_TOKEN='Lm1kwXJDxivOvhkwQDMcsdkgnih';
const XUANTI_TABLE='tbl6aZIDYJbrNUfO';
const PROJECT_TABLE='tblEQrlQYf8Lw9uj';
const XUANTI_STAGES=['资源推进','商务推进','选题包制作','选题包审核','资源确认和下单','内容执行','传播台账','已闭环'];
const PROJECT_STAGES=['立项','采购','议价/招标','合同','执行中','验收','已闭环'];
const COL_STYLES=[
  {bg:'#F1EFE8',fg:'#5F5E5A',cb:'#D3D1C7',cf:'#444441'},
  {bg:'#FAEEDA',fg:'#854F0B',cb:'#FAC775',cf:'#633806'},
  {bg:'#FAEEDA',fg:'#854F0B',cb:'#FAC775',cf:'#633806'},

  {bg:'#EBEBEB',fg:'#555555',cb:'#D4D4D4',cf:'#444444'},
];
let _token=null,_tokenExp=0;
async function getToken(){
  if(_token&&Date.now()<_tokenExp)return _token;
  const r=await fetch('/feishu-api/open-apis/auth/v3/tenant_access_token/internal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_id:APP_ID,app_secret:APP_SECRET})});
  const d=await r.json();
  if(d.code!==0)throw new Error('鉴权失败：'+d.msg);
  _token=d.tenant_access_token;_tokenExp=Date.now()+(d.expire-60)*1000;return _token;
}
let _appToken=null;
async function getAppToken(){
  if(_appToken)return _appToken;
  const token=await getToken();
  const r=await fetch(`/feishu-api/open-apis/wiki/v2/spaces/get_node?token=${WIKI_TOKEN}`,{headers:{Authorization:'Bearer '+token}});
  const d=await r.json();
  if(d.code!==0)throw new Error('获取Wiki节点失败：'+d.msg);
  _appToken=d.data.node.obj_token;return _appToken;
}
async function fetchRecords(tableId){
  const token=await getToken();const appToken=await getAppToken();
  let records=[],pageToken=null;
  do{
    const url=new URL(`/feishu-api/open-apis/bitable/v1/apps/${appToken}/tables/${tableId}/records`,location.href);
    url.searchParams.set('page_size','100');
    if(pageToken)url.searchParams.set('page_token',pageToken);
    const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();
    if(d.code!==0)throw new Error('读取表格失败：'+d.msg);
    records.push(...(d.data.items||[]));
    pageToken=d.data.has_more?d.data.page_token:null;
  }while(pageToken);
  return records;
}
function getField(record,name){
  const v=record.fields[name];
  if(v===undefined||v===null)return null;
  if(Array.isArray(v)&&v[0]?.name)return v.map(x=>x.name).join('、');
  if(Array.isArray(v)&&v[0]?.text!==undefined)return v.map(x=>x.text).join('');
  if(typeof v==='number'&&v>1e12)return v;
  return v;
}
function daysSince(ts){if(!ts)return null;return Math.floor((Date.now()-ts)/86400000);}
function daysUntil(ts){if(!ts)return null;return Math.floor((ts-Date.now())/86400000);}
function getStatus(type,r){
  const stageField=type==='xuanti'?'当前环节':'当前阶段';
  const stage=getField(r,stageField);
  if(stage==='已闭环')return 'gray';
  const left=daysUntil(getField(r,'计划完成时间'));
  if(left!==null){if(left<0)return 'red';if(left<=1)return 'yellow';return 'green';}
  return 'green';
}
function getBadge(type,r){
  const stageField=type==='xuanti'?'当前环节':'当前阶段';
  const enterField=type==='xuanti'?'进入当前环节时间':'阶段进入时间';
  const stage=getField(r,stageField);
  if(stage==='已闭环')return{cls:'b-gray',text:'已闭环'};
  const plan=getField(r,'计划完成时间');
  if(plan!==null){
    const left=daysUntil(plan);
    if(left<0)return{cls:'b-red',text:`超时 ${Math.abs(left)}天`};
    if(left<=1)return{cls:'b-yellow',text:`临近截止 ${left}天`};
    return{cls:'b-green',text:`还剩 ${left}天`};
  }
  const d=daysSince(getField(r,enterField));
  if(d===null)return null;
  return{cls:'b-green',text:`已停留 ${d}天`};
}
const AV=['av0','av1','av2','av3','av4','av5'];
const ownerMap={};let ownerIdx=0;
function avColor(n){if(!n)return'av0';if(!ownerMap[n])ownerMap[n]=AV[ownerIdx++%AV.length];return ownerMap[n];}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderCard(type,r){
  const titleField=type==='xuanti'?'选题名称':'项目名称';
  const ownerField=type==='xuanti'?'当前负责人':'项目负责人';
  const title=getField(r,titleField)||'（无标题）';
  const owner=getField(r,ownerField)||'';
  const status=getStatus(type,r);
  const badge=getBadge(type,r);
  const resType=type==='xuanti'?getField(r,'资源类型'):null;
  const av=avColor(owner);
  const bHtml=badge?`<span class="badge ${badge.cls}">${badge.text}</span>`:'';
  const resHtml=resType?`<div style="margin-top:1px"><span class="badge ${resType==='KOC'?'b-koc':'b-hot'}">${esc(resType)}</span></div>`:'';
  return `<div class="card c-${status}"><div class="card-title">${esc(title)}</div><div class="card-meta"><div class="avatar ${av}">${esc((owner||'?')[0])}</div><span class="person-name">${esc(owner)}</span>${bHtml}</div>${resHtml}</div>`;
}
function renderBoard(type,records){
  const stageField=type==='xuanti'?'当前环节':'当前阶段';
  const stages=type==='xuanti'?XUANTI_STAGES:PROJECT_STAGES;
  const boardEl=document.getElementById(type==='xuanti'?'board-x':'board-p');
  const statsEl=document.getElementById(type==='xuanti'?'stats-x':'stats-p');
  const grouped={};stages.forEach(s=>grouped[s]=[]);
  records.forEach(r=>{const s=getField(r,stageField)||stages[0];if(!grouped[s])grouped[s]=[];grouped[s].push(r);});
  let html='';
  stages.forEach((stage,i)=>{
    const items=grouped[stage]||[];const st=COL_STYLES[i]||COL_STYLES[0];
    html+=`<div class="col"><div class="col-header" style="background:${st.bg};color:${st.fg}"><span>${esc(stage)}</span><span class="col-cnt" style="background:${st.cb};color:${st.cf}">${items.length}</span></div>${items.length?items.map(r=>renderCard(type,r)).join(''):'<div class="state-msg" style="padding:14px 0;font-size:11px">暂无</div>'}</div>`;
  });
  boardEl.innerHTML=html;
  const done=records.filter(r=>getField(r,stageField)==='已闭环').length;
  const overtime=records.filter(r=>getStatus(type,r)==='red').length;
  const warning=records.filter(r=>getStatus(type,r)==='yellow').length;
  const active=records.length-done;
  function getWeekStart(){const now=new Date();const day=now.getDay();const diff=(day===0)?6:day-1;const mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(now.getDate()-diff);return mon.getTime();}
  const weekDone=records.filter(r=>{
    if(getField(r,stageField)!=='已闭环')return false;
    const d=getField(r,type==='xuanti'?'进入当前环节时间':'阶段进入时间');
    if(!d)return false;return d>=getWeekStart()&&d<getWeekStart()+7*86400000;
  }).length;
  statsEl.innerHTML=`<div class="stat"><div class="stat-num">${active}</div><div class="stat-label">进行中</div></div><div class="stat"><div class="stat-num warn">${overtime}</div><div class="stat-label">超时预警</div></div><div class="stat"><div class="stat-num" style="color:#B07A10">${warning}</div><div class="stat-label">临近截止</div></div><div class="stat"><div class="stat-num ok">${weekDone}</div><div class="stat-label">本周已完成</div></div>`;
}
async function loadAll(){
  const btn=document.getElementById('syncBtn');const err=document.getElementById('errorMsg');
  btn.classList.add('loading');err.style.display='none';
  try{
    const[xRecs,pRecs]=await Promise.all([fetchRecords(XUANTI_TABLE),fetchRecords(PROJECT_TABLE)]);
    renderBoard('xuanti',xRecs);renderBoard('project',pRecs);
    document.getElementById('lastSync').textContent='上次同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){err.textContent='⚠ 加载失败：'+e.message;err.style.display='block';}
  finally{btn.classList.remove('loading');}
}
window.addEventListener('DOMContentLoaded',loadAll);
</script>
